# SonarCloud project configuration
sonar.projectKey=steve192_opencookbook-frontend
sonar.organization=steve192
sonar.projectName=opencookbook-frontend

sonar.sources=src
sonar.test.inclusions=src/**/*.test.ts

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  cypress/**

# Coverage is measured on logic modules only. The following have no unit-test
# harness or contain no testable logic, so they are excluded from the coverage
# denominator (they are still analysed for code smells via sonar.sources):
#   - *.tsx : React components (no component-test runner configured)
#   - styles/theme : declarative StyleSheet/theme data
#   - navigation route types, i18n config, redux store wiring : no branching logic
sonar.coverage.exclusions=\
  src/**/*.test.ts,\
  src/**/*.tsx,\
  src/styles/**,\
  src/navigation/NavigationRoutes.ts,\
  src/i18n/config.ts,\
  src/redux/hooks.ts,\
  src/redux/store.ts

# JavaScript / TypeScript coverage (LCOV produced by @vitest/coverage-v8)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
