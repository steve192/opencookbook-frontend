user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log debug;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml application/xml text/plain;

    server {
        listen 80;
        client_max_body_size 10M;
        root /usr/share/nginx/html;
        # Behind TLS-terminating proxies an absolute Location would carry the wrong scheme.
        absolute_redirect off;

        set $landing ${LANDING_ENABLED};

        # Hashed bundles and assets. A miss here means a client is asking for a file from an
        # older deploy; answering with index.html would hand the browser html where it
        # expects javascript. A plain 404 keeps the failure legible and lets the service
        # worker recover.
        location ~ ^/app/(_expo|assets)/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Only for an nginx whose mime types do not know the extension yet.
        location = /app/manifest.webmanifest {
            default_type application/manifest+json;
            add_header Cache-Control "no-cache";
        }

        location = /app {
            return 301 /app/;
        }

        # Asked again on every load, so a deploy reaches index.html and sw.js at once; the service
        # worker keeps its own copy for offline use.
        location /app/ {
            add_header Cache-Control "no-cache";
            try_files $uri /app/index.html;
        }

        # Installations from before the app moved to /app registered their worker here;
        # see nginx/root/sw.js.
        location = /sw.js {
            add_header Cache-Control "no-cache";
        }

        # Android App Links verification, independent of the landing switch.
        location /.well-known/ {
            try_files $uri =404;
        }

        # Links that were sent out before the app moved to /app.
        location ~ ^/(share/|household-invite/|activateAccount$|resetPassword$) {
            return 301 /app$request_uri;
        }

        location = /tos {
            return 301 /app/legal/terms;
        }

        location = /robots.txt {
            default_type text/plain;
            if ($landing != 'true') {
                return 200 "User-agent: *\nDisallow: /\n";
            }
        }

        location /_astro/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            if ($landing != 'true') {
                return 302 /app$request_uri;
            }
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ =404;
            error_page 404 /404.html;
        }
    }
}
