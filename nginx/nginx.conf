user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log debug;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    server {
        listen 80;
        client_max_body_size 10M;
        # Hashed build assets. A miss here means a client is asking for a bundle from an
        # older deploy, and answering that with index.html hands the browser html where it
        # expects javascript ("Uncaught SyntaxError: Unexpected token '<'"). A plain 404
        # keeps the failure legible and lets the service worker recover.
        location /_expo/ {
            root   /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Only for an nginx whose mime types do not know the extension yet.
        location = /manifest.webmanifest {
            root   /usr/share/nginx/html;
            default_type application/manifest+json;
            add_header Cache-Control "no-cache";
        }

        # Asked again on every load, so a deploy reaches index.html and sw.js at once; the service
        # worker keeps its own copy for offline use.
        location / {
            add_header Access-Control-Allow-Origin https://api.getbring.com;
            add_header Cache-Control "no-cache";
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri /index.html;
        }
    }
}