name: Publish preview

# Manual preview channel: builds the web bundle, publishes it as the `:preview`
# Docker image and ships an Expo OTA update on the preview branch. Points at the
# preview backend rather than the production one.

on: workflow_dispatch

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEFAULT_API_URL: https://preview.cookpal.io

jobs:
  publish-docker:
    name: Publish preview image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build web bundle
        run: npm run build-web

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:preview
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  publish-expo-update:
    name: Publish preview Expo update
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Publish Expo update
        if: ${{ env.EXPO_TOKEN != '' }}
        run: npm run publish-expo-preview
