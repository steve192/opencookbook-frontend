name: Build & Test

# Reusable validation suite: dependency audit, types, lint, unit tests and a
# smoke-tested Docker build (which builds the web bundle and the landing page and
# runs the landing page checks). Called by ci.yml (for pushes / PRs) and by
# expo-sdk-update.yml (against its update branch) so the validation logic lives
# in one place.

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out and validate. Empty = the triggering ref."
        type: string
        required: false
        default: ""

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Expo dependency check
        run: npx expo-doctor

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: cookpal-ci:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Smoke test Docker image
        run: bash scripts/smoke-test-image.sh cookpal-ci:${{ github.sha }}
