name: Setup
description: >-
  Set up Node from .nvmrc with an npm cache and (by default) install
  dependencies. The repository must already be checked out.

inputs:
  install:
    description: Whether to run `npm ci` after setting up Node.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6.5.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: npm ci
